function setLang(lang) {
  const c = content[lang] || content['en'];
  document.getElementById('content').innerHTML =
    `<h1>${c.title}</h1><p class="date">${c.date}</p>${c.body}`;
  document.getElementById('terms-link').textContent = c.termsLink;
  document.documentElement.lang = lang;
  document.documentElement.dir = c.dir;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

// Auto-detect browser language
const browserLang = navigator.language.slice(0, 2);
const supported = ['fr', 'en', 'de', 'es', 'pt', 'zh', 'hi', 'ar'];
const defaultLang = supported.includes(browserLang) ? browserLang : 'fr';
const defaultBtn = document.querySelector(`.lang-btn:nth-child(${supported.indexOf(defaultLang) + 1})`);
if (defaultBtn) { defaultBtn.classList.add('active'); document.querySelectorAll('.lang-btn')[0].classList.remove('active'); }
setLang(defaultLang);
</script>
